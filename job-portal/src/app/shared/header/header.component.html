<header>
    <!-- Header Start -->
   <div class="header-area header-transparrent">
       <div class="headder-top header-sticky">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-3 col-md-2">
                        <!-- Logo -->
                        <div class="logo">
                            <a href="index.html"><img src="assets/img/logo/logo.png" alt=""></a>
                        </div>  
                    </div>
                    <div class="col-lg-9 col-md-9">
                        <div class="menu-wrapper">
                            <!-- Main-menu -->
                            <div class="main-menu">
                                <nav class="d-none d-lg-block">
                                    <ul id="navigation">
                                        <li><a [routerLink]="['/home']">Home</a></li>
                                        <li><a [routerLink]="['/jobs']">Find a Jobs </a></li>
                                        <li><a [routerLink]="['/about']">About</a></li>
                                        <li><a [routerLink]="['/contact']">Contact</a></li>
                                        <li *ngIf="userRole === 'Employer'">
                                            <a [routerLink]="['/employer']">Employer Dashboard</a>
                                          </li>
                                          

                                    </ul>
                                </nav>
                            </div>          
                              <div class="header-btn d-none f-right d-lg-block">
                                 <ng-container *ngIf="!isLoggedIn">
                                  <a [routerLink]="['/register']" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-3 rounded mr-3">Register</a>
                                  <a  class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-3 rounded" (click)="login()">Login</a>
                                </ng-container>
                                <ng-container class="ml-20" *ngIf="isLoggedIn">
                                    <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-3 rounded" (click)="logout()">Logout</button>
                                </ng-container>
                              </div>
                        </div>
                    </div>
                   
                    <div class="col-12">
                        <div class="mobile_menu d-block d-lg-none"></div>
                    </div>
                </div>
            </div> 
       </div>
   </div>
    <!-- Header End -->
</header>
