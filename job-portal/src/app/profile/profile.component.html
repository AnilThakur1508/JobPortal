<div class="container">
  <h2>Employee Profile</h2>
  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" class="form-control" formControlName="dob" required>
    </div>
    <div class="form-group">
      <label>Resume ID</label>
      <input type="text" class="form-control" formControlName="resumeId" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea class="form-control" formControlName="description" maxlength="500" required></textarea>
    </div>

    <fieldset formGroupName="address">
      <legend>Address</legend>
      <div class="form-group">
        <label>Address Line 1</label>
        <input type="text" class="form-control" formControlName="addressLine1" required>
      </div>
      <div class="form-group">
        <label>Address Line 2</label>
        <input type="text" class="form-control" formControlName="addressLine2">
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" class="form-control" formControlName="city" required>
      </div>
      <div class="form-group">
        <label>StateId</label>
        <input type="text" class="form-control" formControlName="stateId" required>
      </div>
      <div class="form-group">
        <label>Zip Code</label>
        <input type="text" class="form-control" formControlName="zipcode" required>
      </div>
      <div class="form-group">
        <label>CountryId</label>
        <input type="text" class="form-control" formControlName="countryId" required>
      </div>
    </fieldset>

    <!-- Action Buttons -->
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-success">
        <i class="fas fa-save"></i> {{ selectedProfileId ? 'Update' : 'Create' }} Profile
      </button>
      
      <button *ngIf="selectedProfileId" type="button" class="btn btn-danger" (click)="resetForm()">
        <i class="fas fa-times"></i> Cancel
      </button>
    </div>
  </form>

  <h3 class="mt-4">Employee Profiles</h3>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Date of Birth</th>
        <th>Resume ID</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let profile of profiles" [class.table-active]="selectedProfileId === profile.userId">
        <td>{{ profile.dob }}</td>
        <td>{{ profile.resumeId }}</td>
        <td>{{ profile.description }}</td>
        <td>
          <button class="btn btn-warning btn-sm" (click)="selectProfile(profile)">
            <i class="fas fa-edit"></i> Edit
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
