<div class="container mt-4">
    <h2>Job Applications</h2>
  
    <table class="table table-hover table-bordered align-middle text-center">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Experience (years)</th>
            <th>Qualification</th>
            <th>Applied On</th>
            <th>Resume</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let app of appllications; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ app.firstName }}</td>
            <td>{{ app.lastName }}</td>
            <td>{{ app.experience }}</td>
            <td>{{ app.qualification }}</td>
            <td>{{ app.appliedOn | date: 'mediumDate' }}</td>
          
            <td>
              <a
                *ngIf="app.resume"
                [href]="app.resume.startsWith('/resumes') ? imageBaseUrl + app.resume : app.resume"
                target="_blank"
                rel="noopener noreferrer"
              >
              <i class="fas fa-eye" title="View Document" style="color: #000000;"></i>

              </a>
              <span *ngIf="!app.resume" class="text-muted">N/A</span>
            </td>
            <td>{{ app.status}}</td>
           <td class="d-flex"><div> <button 
            id="acceptButton"
            *ngIf="app.status === 'Pending' || app.status === 'Declined'"
            (click)="UpdateStatus(app, 'Accepted')" 
            style="
            background-color: #068f06;
            color: white;
            border: none;
           border-radius: 8px;
           font-size: 16px;
           cursor: pointer;
           transition: background-color 0.3s ease;
           margin-right: 10px;"
           onmouseover="this.style.backgroundColor='#168c16'"
            onmouseout="this.style.backgroundColor='#1c9b1c'">
            Accept
         </button> </div>     
         <div><button 
          id="declineButton"
          *ngIf="app.status === 'Pending' || app.status === 'Accepted'"
          (click)="UpdateStatus(app, 'Declined')" 
         style="
        background-color: #ea3838;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;"
       onmouseover="this.style.backgroundColor='#d92020'"
       onmouseout="this.style.backgroundColor='#fa2323'">
        Decline
    </button></div>
   
  </td>
          </tr>
        </tbody>
      </table>
      
  
    <ng-template #noData>
      <p class="text-muted">No applications found.</p>
    </ng-template>
</div>
